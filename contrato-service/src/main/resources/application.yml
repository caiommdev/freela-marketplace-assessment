server:
  port: 8081

spring:
  application:
    name: contrato-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrato_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9093
    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer
      value-serializer:
        org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        acks: all

    topics:
      freela-marketplace.contrato.criado: freela-marketplace.contrato.criado
      freela-marketplace.contrato.entrega-registrada: freela-marketplace.contrato.entrega-registrada
      freela-marketplace.contrato.concluido: freela-marketplace.contrato.concluido
      freela-marketplace.contrato.cancelado: freela-marketplace.contrato.cancelado

    template:
      observation-enabled: false
    listener:
      observation-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}


