server:
  port: 8081

spring:
  application:
    name: contrato-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contrato_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9093
    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer
      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        acks: all

    topics:
      freela-marketplace.contrato.criado: freela-marketplace.contrato.criado
      freela-marketplace.contrato.entrega-registrada: freela-marketplace.contrato.entrega-registrada
      freela-marketplace.contrato.concluido: freela-marketplace.contrato.concluido
      freela-marketplace.contrato.cancelado: freela-marketplace.contrato.cancelado

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} thread=%thread logger=%logger{36} - %msg%n"
  level:
    root: INFO
    br.com.freela: INFO
    org.hibernate.SQL: INFO
